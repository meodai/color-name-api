name: Color lists

# Hourly: when color-name-list or color-name-lists has a newer release on npm, take it,
# run the tests as CI does, and push to main, which deploys the API. Saves triggering
# Dependabot by hand. Once the new list is live, api.color.pizza's Cloudflare cache is
# purged (only that host), if CLOUDFLARE_PURGE_TOKEN and CLOUDFLARE_ZONE_ID are set.
# The taglines from names.color.pizza are synced the same way, but a tagline-only
# change doesn't purge: it shows up once the cached responses expire.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: color-lists
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
      CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Newer lists on npm?
        id: lists
        run: |
          behind=""
          for pkg in color-name-list color-name-lists; do
            have=$(node -p "require('./package-lock.json').packages['node_modules/$pkg'].version")
            latest=$(npm view "$pkg" version)
            echo "$pkg: $have, npm has $latest"
            [ "$have" != "$latest" ] && behind="$behind $pkg@$latest"
          done
          echo "behind=$behind" >> "$GITHUB_OUTPUT"

      - name: Newer taglines on names.color.pizza?
        id: taglines
        run: |
          # a names.color.pizza outage must not hold back the list bumps
          if ! node scripts/taglines.js; then
            echo "::warning::Could not sync the taglines, keeping the ones we have"
            git checkout -- data/taglines.json
          fi
          if git diff --quiet -- data/taglines.json; then
            echo "changed=" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Take them
        if: steps.lists.outputs.behind != ''
        run: npm install --save-exact=false ${{ steps.lists.outputs.behind }}

      - name: Install for a tagline-only change
        if: steps.lists.outputs.behind == '' && steps.taglines.outputs.changed != ''
        run: npm ci

      - name: Boot server and run tests
        if: steps.lists.outputs.behind != '' || steps.taglines.outputs.changed != ''
        env:
          NODB: "true"
          PORT: "8080"
        run: |
          npm start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/v1/ > /dev/null; then break; fi
            if [ "$i" -eq 30 ]; then kill $SERVER_PID 2>/dev/null || true; exit 1; fi
            sleep 2
          done
          STATUS=0
          npm run test:ci || STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      - name: Push to main
        if: steps.lists.outputs.behind != '' || steps.taglines.outputs.changed != ''
        env:
          BEHIND: ${{ steps.lists.outputs.behind }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json data/taglines.json
          if [ -n "$BEHIND" ]; then
            msg="bump:$BEHIND"
            git diff --cached --quiet -- data/taglines.json || msg="$msg, taglines"
          else
            msg="taglines: sync from names.color.pizza"
          fi
          git commit -m "$msg"
          git push

      - name: Purge api.color.pizza once the new list is live
        if: steps.lists.outputs.behind != '' && env.CF_TOKEN != ''
        run: |
          want=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/color-name-list/dist/colornames.json','utf8')).length")
          for i in $(seq 1 40); do
            have=$(curl -s "https://api.color.pizza/v1/?list=default&t=$RANDOM$RANDOM" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).colors.length)}catch{console.log(0)}})")
            echo "live: $have names, the new list: $want"
            [ "$have" = "$want" ] && break
            sleep 15
          done
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"hosts":["api.color.pizza"]}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log('purged:', JSON.parse(s).success))"
